<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blobz.io</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%236b4cf0'/%3E%3C/svg%3E">
<style>
:root{--bg:#eef0f7;--grid:#dde1ee;--fg:#1b1d2e;--card:#fff;--mut:#666b85;--acc:#6b4cf0;--wall:#e5484d;--gold:#c98500;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141f;--grid:#1d2132;--fg:#e9ebf6;--card:#1b1f31;--mut:#9aa0bd;--acc:#8f7bff;--gold:#ffc83d}}
:root[data-theme="dark"]{--bg:#12141f;--grid:#1d2132;--fg:#e9ebf6;--card:#1b1f31;--mut:#9aa0bd;--acc:#8f7bff;--gold:#ffc83d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;font-size:13px}
#hud>div,#mm{background:color-mix(in srgb,var(--card) 85%,transparent);border-radius:10px}
#hud>div{padding:6px 10px;white-space:pre}
#st{pointer-events:auto}
#em{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column-reverse;align-items:center;gap:6px}
#em button{width:44px;height:44px;padding:0;margin:0;border-radius:50%;font-size:22px;background:var(--card);box-shadow:0 2px 10px rgba(20,20,60,.2)}
#emr{display:flex;gap:6px;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--card) 90%,transparent)}
#emr[hidden]{display:none}
#bn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;pointer-events:none;text-align:center}
.rw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
.rw button{width:auto;margin:0;padding:5px 8px;font-size:20px;background:var(--bg);color:var(--fg);border:2px solid transparent}
.rw button.on{border-color:var(--acc)}
#rl button{background:var(--bg);color:var(--fg);font-weight:600;text-align:left;font-size:14px;margin:0 0 6px}
details{text-align:left;margin-bottom:10px;color:var(--mut)}
summary{cursor:pointer;margin-bottom:8px}
label.ck{display:flex;align-items:center;font-size:14px;color:var(--fg);margin:4px 0 8px}
input[type=checkbox]{width:auto;margin:0 8px 0 0;padding:0}
#ver{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);font-size:11px;color:var(--mut);opacity:.8;pointer-events:none}
#mm{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:96px;height:96px;pointer-events:none}
#bst{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:76px;height:76px;border-radius:50%;padding:0;font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none}
#ov{position:fixed;inset:0;display:flex;flex-wrap:wrap;gap:12px;overflow:auto;align-items:flex-start;align-content:safe center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 70%,transparent)}
#card{background:var(--card);border-radius:18px;padding:22px;width:min(340px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 36px rgba(20,20,60,.2)}
h1{margin:0 0 6px;font-size:30px;letter-spacing:-.02em}
p{color:var(--mut);margin:0 0 14px}
input,button,select{font:inherit;font-size:16px;width:100%;box-sizing:border-box;border-radius:10px;padding:12px;border:1px solid var(--grid);background:var(--bg);color:var(--fg);margin-bottom:8px}
input[type=range]{padding:0;border:0;background:transparent;height:28px}
button{background:var(--acc);border:0;color:#fff;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{display:block;text-align:left;font-size:12px;color:var(--mut);margin:2px 2px 4px}
#lb .k1{color:var(--gold);font-weight:800}
#mnb{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 86px);width:auto;margin:0;padding:7px 12px;font-size:13px;background:color-mix(in srgb,var(--card) 88%,transparent);color:var(--fg);border:1px solid var(--grid)}
#cf,#dc,#tc{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,10,30,.5)}
#cf[hidden],#dc[hidden],#tc[hidden]{display:none}
#cf>div,#dc>div,#tc>div{background:var(--card);border-radius:18px;padding:22px;width:min(320px,100%);text-align:center;box-shadow:0 10px 36px rgba(20,20,60,.3)}
#cf h2,#dc h2,#tc h2{margin:0 0 6px;font-size:22px}
#cfy{background:var(--wall)}
#goal{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;padding:8px 20px;border-radius:16px;background:color-mix(in srgb,var(--card) 88%,transparent);box-shadow:0 4px 16px rgba(20,20,60,.15);white-space:nowrap}
#goal[hidden]{display:none}#goal b{display:block;font-size:30px;line-height:1.1}#goal small{display:block;font-size:12px;color:var(--mut)}
#pi{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);padding:8px 14px;border-radius:12px;background:color-mix(in srgb,var(--card) 94%,transparent);box-shadow:0 4px 16px rgba(20,20,60,.2);text-align:center;pointer-events:none;max-width:min(300px,90vw)}
#pi[hidden]{display:none}#pi b{display:block}#pi small{color:var(--mut)}
.alt{background:var(--bg);color:var(--fg);border:1px solid var(--grid)}
#msg:empty{display:none}.rw button.t{font-size:13px}
#skw{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,10,30,.5)}
#skw[hidden]{display:none}
#skp{display:flex;flex-direction:column;background:var(--card);border-radius:18px;width:min(300px,100%);max-height:100%;overflow:hidden;text-align:center;box-shadow:0 10px 36px rgba(20,20,60,.3)}
#skh{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 4px 18px}#skh h2{margin:0;font-size:20px}
#skx{width:36px;height:36px;margin:0;padding:0;border-radius:50%;font-size:16px;background:var(--bg);color:var(--fg);border:1px solid var(--grid)}
#skb{overflow:auto;min-height:0;padding:4px 18px 18px}#skp canvas{width:120px;height:120px;display:block;margin:0 auto 10px}
#ptg{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 10px;padding:12px 14px;border-radius:14px;background:var(--bg);border:2px solid var(--grid);cursor:pointer;font-size:18px;font-weight:800;color:var(--fg)}
#ptg.on{border-color:var(--acc)}#ptg:has(input:focus-visible){outline:3px solid var(--acc);outline-offset:2px}
#ptg input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
#ptg .pr{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut)}#ptg.on .pr{color:var(--acc)}
#ptg .sw{position:relative;width:62px;height:34px;border-radius:17px;background:var(--grid);flex:none;transition:background .15s}
#ptg .sw::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .15s}
#ptg.on .sw{background:var(--acc)}#ptg.on .sw::after{transform:translateX(28px)}
#rl button,#ol button{white-space:pre-line;line-height:1.35}#ol button{background:var(--bg);color:var(--fg);font-weight:600;text-align:left;font-size:14px;margin:0 0 6px}#pks{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{-webkit-user-select:text;user-select:text}
@media(pointer:coarse){#bst{width:96px;height:96px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);font-size:16px;opacity:.9}#mm{opacity:.8}}
#inf{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 126px);width:38px;height:34px;margin:0;padding:0;font-size:18px;background:color-mix(in srgb,var(--card) 88%,transparent);color:var(--fg);border:1px solid var(--grid)}
#ip{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 168px);max-width:min(320px,calc(100vw - 20px));padding:10px 12px;border-radius:12px;background:var(--card);color:var(--fg);white-space:pre-line;font-size:13px;box-shadow:0 6px 24px rgba(20,20,60,.25);z-index:5}#ip[hidden]{display:none}
</style>
</head>

<div id="oT" hidden><label for="tgm">Seekers</label><select id="tgm"><option value="0">Only one</option><option value="1">Percent of players</option></select><div id="tgx" hidden><label for="tgp">Seekers: <span id="tgv">20</span>% of players</label><input id="tgp" type="range" min="5" max="80" value="20"></div></div><label class="ck"><input type="checkbox" id="dg"> Deadly edges and walls</label><label class="ck"><input type="checkbox" id="wr"> Run off the map: wrap around the edges (then only maze walls can be deadly)</label><label class="ck"><input type="checkbox" id="bu"> Bushes: green killer bushes (kill any blob bigger than them that pushes into them; always on in Splitter)</label><label class="ck"><input type="checkbox" id="tmo"> Teams (coloured outlines; teammates can’t eat each other)</label><div id="oTm" hidden><label for="tmn">Number of teams: <span id="tmv">2</span></label><input id="tmn" type="range" min="2" max="6" value="2"></div><label for="pm">Player mode</label><select id="pm"><option value="0">Normal blob</option><option value="1">Snake: grow a tail</option><option value="2">Splitter: like Agar.io (split, killer bushes)</option><option value="3">Combined: everyone picks Blob, Snake or Splitter</option><option value="4">Combined without snake: everyone picks Blob or Splitter</option></select><label class="ck"><input type="checkbox" id="bon" checked> Bots</label><div id="oB"><label for="bct">Number of bots: <span id="bcv">6</span></label><input id="bct" type="range" min="1" max="30" value="6"></div><label for="sz">Map size</label><select id="sz"><option value="0">Small</option><option value="1" selected>Medium</option><option value="2">Big</option><option value="3">Huge</option></select><label for="mt">Map type</label><select id="mt"><option value="0">Open</option><option value="1">Maze</option></select><div id="oS" hidden><label for="sd">Maze seed (empty = random)</label><input id="sd" maxlength="20" autocomplete="off" placeholder="random"></div>
<button id="go">Create room</button><button class="alt back">← Back</button></div>
<div id="vb" hidden><div id="rl"></div><button class="alt back">← Back</button></div>
<div id="vo" hidden><div id="ol"></div><button class="alt back">← Back</button></div>
<div id="vs" hidden><label for="sth">Theme</label><select id="sth"><option value="auto">Auto (device)</option><option value="light">Light</option><option value="dark">Dark</option></select><label class="ck"><input type="checkbox" id="snm"> Show names</label><label class="ck"><input type="checkbox" id="sey"> Show eyes</label><label class="ck"><input type="checkbox" id="sms"> Show mass on blobs</label><label for="szm">Camera zoom speed</label><input id="szm" type="range" min="1" max="8" step=".5"><label for="sjg">Joystick sensitivity</label><input id="sjg" type="range" min="1" max="3" step=".1"><button class="alt back">← Back</button></div>
<div id="vj" hidden><label for="rj">Room name</label><input id="rj" maxlength="20" autocomplete="off" aria-label="Room name to join"><button id="gj">Join</button><button class="alt back">← Back</button></div>
<p id="net" style="margin:8px 0 0;font-size:13px">Connecting…</p>
</div>
<div id="skw" hidden role="dialog" aria-modal="true" aria-labelledby="skt"><div id="skp"><div id="skh"><h2 id="skt">Your blob</h2><button id="skx" aria-label="Close">✕</button></div><div id="skb"><canvas id="sk" width="120" height="120"></canvas>
<label for="hue">Body colour</label><input id="hue" type="range" min="0" max="359">
<label id="ptg" for="pton"><input type="checkbox" id="pton"><span>🎨 Pattern</span><span class="pr"><span id="ptv">Off</span><span class="sw"></span></span></label>
<div id="ptb" hidden><div class="rw" id="pat"></div><label for="phue">Pattern colour</label><input id="phue" type="range" min="0" max="359"><label for="pvr">Pattern variation</label><input id="pvr" type="range" min="0" max="100"><label for="psh">Pattern position</label><input id="psh" type="range" min="0" max="100" value="0"><label for="pzs">Pattern size</label><input id="pzs" type="range" min="0" max="100" value="50"></div>
<label>Eyes</label><div class="rw" id="eyr"></div>
<details><summary>Emotes (pick a slot, then an emoji)</summary><div class="rw" id="es"></div><div class="rw" id="ep"></div></details><button id="skd">Done</button></div></div></div></div>
<div id="bn" hidden></div>
<div id="goal" hidden><b id="gm"></b><small id="gs"></small></div>
<div id="pi" hidden></div>

<button id="mnb" hidden title="Back to menu (Esc)">☰ Menu</button><button id="inf" hidden aria-label="Room info">ⓘ</button><div id="ip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let W=2200;const VERSION="3.7",$=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),mg=$('mm').getContext('2d');
let dpr=1,vw=0,vh=0;
function rs(){dpr=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr}
addEventListener('resize',rs);rs();
const rnd=(a,b)=>a+Math.random()*(b-a),R=m=>PM()===1?7+1.2*Math.sqrt(m):4*Math.sqrt(m),sp=m=>300*Math.pow(m,-.15),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const col=h=>`hsl(${h} 70% 56%)`;
const SIZES=[{n:'Small',w:1500,p:200},{n:'Medium',w:2200,p:330},{n:'Big',w:3200,p:520},{n:'Huge',w:4800,p:900}];
function genMaze(w,seed){let a=seed>>>0||1;const rn=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const n=Math.max(3,Math.round(w/440)),cs=w/n,vw=[],hw=[],sn=[];for(let i=0;i<n;i++){vw.push(Array(n).fill(1));hw.push(Array(n).fill(1));sn.push(Array(n).fill(0))}
const st=[[0,0]];sn[0][0]=1;
while(st.length){const[i,j]=st[st.length-1],nb=[[i+1,j],[i-1,j],[i,j+1],[i,j-1]].filter(([x,y])=>x>=0&&y>=0&&x<n&&y<n&&!sn[x][y]);if(!nb.length){st.pop();continue}
const[x,y]=nb[rn()*nb.length|0];sn[x][y]=1;if(x>i)vw[i][j]=0;else if(x<i)vw[x][y]=0;else if(y>j)hw[i][j]=0;else hw[x][y]=0;st.push([x,y])}
const o=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(i<n-1&&vw[i][j]&&rn()>.25)o.push([(i+1)*cs-25,j*cs-25,50,cs+50]);if(j<n-1&&hw[i][j]&&rn()>.25)o.push([i*cs-25,(j+1)*cs-25,cs+50,50])}return o}
const mkMap=(sz,ty,sd)=>{sz=cl(sz|0,0,3);const s=SIZES[sz],o={n:s.n+(ty?' maze':''),w:s.w,p:s.p,sz,ty:ty?1:0,seed:ty?sd|0:0};if(sz===0)o.pal={bg:'#0d0b1f',grid:'#1e1a45',wall:'#ff3fa4'};if(ty)o.walls=genMaze(o.w,o.seed);return o};
let CUR=mkMap(1,0,0);
const T={bg:'#eee',grid:'#ddd',wall:'#e5484d'};
function th(){const s=getComputedStyle(document.documentElement);T.bg=s.getPropertyValue('--bg').trim();T.grid=s.getPropertyValue('--grid').trim();T.wall=s.getPropertyValue('--wall').trim();if(CUR.pal)Object.assign(T,CUR.pal)}
th();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',th);
const TS={bg:'#090b18',grid:'#141833',wall:'#ff4d6d'},spr=new Map();let DT=.016;
function sprite(kind,h){h=Math.round(h/6)%60*6;const k=kind+h;let c=spr.get(k);if(c)return c;
  c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),m=64;
  if(kind==='g'){const q=x.createRadialGradient(m,m,10,m,m,64);q.addColorStop(0,`hsla(${h},95%,60%,.6)`);q.addColorStop(.45,`hsla(${h},95%,55%,.2)`);q.addColorStop(1,`hsla(${h},95%,50%,0)`);x.fillStyle=q;x.fillRect(0,0,128,128)}
  else{const q=x.createRadialGradient(m-12,m-14,3,m,m,40);q.addColorStop(0,`hsl(${h},90%,90%)`);q.addColorStop(.35,`hsl(${h},85%,62%)`);q.addColorStop(1,`hsl(${h},80%,38%)`);x.fillStyle=q;x.beginPath();x.arc(m,m,40,0,6.2832);x.fill();x.lineWidth=3;x.strokeStyle=`hsla(${h},90%,80%,.55)`;x.stroke()}
  spr.set(k,c);return c}

function drawPat(c,x,y,r,pa,ph,pv){pv=pv||0;const z=pv/10201|0,sh=(pv%10201)/101|0;pv%=101;

  else if(pa===4){const q=r*.4;for(let i=-3;i<=2;i++)for(let j=-3;j<=2;j++)if((i+j)&1)c.fillRect(x+i*q,y+j*q,q,q)}

  else if(pa===6){c.lineWidth=r*.12;for(let k=-3;k<=3;k++){c.beginPath();for(let i=-5;i<=5;i++)c.lineTo(x+i*r*.22,y+k*r*.4+(i&1?r*.12:-r*.12));c.stroke()}}
  else if(pa===7){c.font=r*.38+'px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)c.fillText('★',x+i*r*.5+(j&1?r*.25:0),y+j*r*.45)}
  else if(pa===8){c.lineWidth=r*.1;c.beginPath();for(let a=0;a<18;a+=.15){const q=a/18*r*1.1;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.stroke()}
  else if(pa===9){c.lineWidth=r*.1;for(let k=-3;k<=3;k++){c.beginPath();for(let i=-10;i<=10;i++)c.lineTo(x+i*r*.11,y+k*r*.35+Math.sin(i*.7)*r*.1);c.stroke()}}
  else if(pa===10)c.fillRect(x-r,y,r*2,r)
  else if(pa===11){const q=r*.2;for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++)if(!((i+j)&1)){const u=x+i*r*.4,v=y+j*r*.4;c.beginPath();c.moveTo(u,v-q);c.lineTo(u+q,v);c.lineTo(u,v+q);c.lineTo(u-q,v);c.fill()}}
  else if(pa===12){c.lineWidth=r*.07;c.beginPath();for(let k=-3;k<=3;k++){c.moveTo(x+k*r*.4,y-r);c.lineTo(x+k*r*.4,y+r);c.moveTo(x-r,y+k*r*.4);c.lineTo(x+r,y+k*r*.4)}c.stroke()}
  else if(pa===13){const q=r*.16,t=r*.05;for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){const u=x+i*r*.5,v=y+j*r*.5;c.fillRect(u-q,v-t,q*2,t*2);c.fillRect(u-t,v-q,t*2,q*2)}}
  else if(pa===14)for(let i=0;i<9;i++){const a=i*2.4+pv*.37,d=r*.7*(((i+(pv|0))%3)/3+.2);c.beginPath();c.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,r*(.18+((i*(1+pv%2))%3)*.05),0,6.2832);c.fill()}
  else if(pa===15){c.font=r*.4+'px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)c.fillText('♥',x+i*r*.5+(j&1?r*.25:0),y+j*r*.45)}
  else if(pa===16){c.lineWidth=r*.07;for(let i=0;i<7;i++){const a=i*2.1+pv*.3,d=r*.55*((i%3)/3+.35);c.beginPath();c.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,r*(.14+(i%4)*.06),0,6.2832);c.stroke()}}
  else if(pa===17){const q=r*.18;for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++)if(!((i+j)&1)){const u=x+i*r*.4,v=y+j*r*.4;c.beginPath();c.moveTo(u,v-q);c.lineTo(u+q,v+q);c.lineTo(u-q,v+q);c.fill()}}
  else if(pa===18){c.lineWidth=r*.12;for(let k=-3;k<=3;k++){c.beginPath();c.moveTo(x-r,y+k*r*.4-r*.3);c.lineTo(x,y+k*r*.4+r*.1);c.lineTo(x+r,y+k*r*.4-r*.3);c.stroke()}}

  else if(pa===21){c.lineWidth=r*.07;const q=r*.34;for(let j=-4;j<=4;j++)for(let i=-4;i<=4;i++){c.beginPath();c.arc(x+i*q*2+(j&1?q:0),y+j*q*.8,q,0,Math.PI);c.stroke()}}

  else if(pa===23){for(let i=-1;i<=1;i++)for(let j=-2;j<=2;j++){const u=x+i*r*.75+(j&1?r*.37:0),v=y+j*r*.55;for(let k=0;k<5;k++){c.beginPath();c.arc(u+Math.cos(k*1.2566)*r*.14,v+Math.sin(k*1.2566)*r*.14,r*.1,0,6.2832);c.fill()}}}
  else if(pa===24){c.lineWidth=r*.07;c.lineCap='round';for(let i=0;i<26;i++){const a=i*2.399,d=r*Math.sqrt((i+.5)/26)*1.05,u=x+Math.cos(a)*d,v=y+Math.sin(a)*d,t=i*1.7;c.beginPath();c.moveTo(u,v);c.lineTo(u+Math.cos(t)*r*.15,v+Math.sin(t)*r*.15);c.stroke()}}
  else if(pa===25){const q=r*.28;for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++)if(((i*7+j*13)&3)===0)c.fillRect(x+i*q,y+j*q,q*.9,q*.9)}
  c.restore();
}
