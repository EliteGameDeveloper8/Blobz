<html lang="en">

<title>Blobz.io</title>

<style>
:root{--bg:#eef0f7;--grid:#dde1ee;--fg:#1b1d2e;--card:#fff;--mut:#666b85;--acc:#6b4cf0;--wall:#e5484d;--gold:#c98500;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#12141f;--grid:#1d2132;--fg:#e9ebf6;--card:#1b1f31;--mut:#9aa0bd;--acc:#8f7bff;--gold:#ffc83d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud>div,#mm{background:color-mix(in srgb,var(--card) 85%,transparent);border-radius:10px}

#st{pointer-events:auto}

#ver{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);font-size:11px;color:var(--mut);opacity:.8;pointer-events:none}
#mm{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:96px;height:96px;pointer-events:none}

#ov{position:fixed;inset:0;display:flex;flex-wrap:wrap;gap:12px;overflow:auto;align-items:flex-start;align-content:safe center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 70%,transparent)}
#card{background:var(--card);border-radius:18px;padding:22px;width:min(340px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 36px rgba(20,20,60,.2)}
h1{margin:0 0 6px;font-size:30px;letter-spacing:-.02em}
p{color:var(--mut);margin:0 0 14px}
input,button,select{font:inherit;font-size:16px;width:100%;box-sizing:border-box;border-radius:10px;padding:12px;border:1px solid var(--grid);background:var(--bg);color:var(--fg);margin-bottom:8px}
input[type=range]{padding:0;border:0;background:transparent;height:28px}
button{background:var(--acc);border:0;color:#fff;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{display:block;text-align:left;font-size:12px;color:var(--mut);margin:2px 2px 4px}
#lb .k1{color:var(--gold);font-weight:800}

#cf[hidden],#dc[hidden]{display:none}
#cf>div,#dc>div{background:var(--card);border-radius:18px;padding:22px;width:min(320px,100%);text-align:center;box-shadow:0 10px 36px rgba(20,20,60,.3)}
#cf h2,#dc h2{margin:0 0 6px;font-size:22px}
#cfy{background:var(--wall)}

#pi[hidden]{display:none}#pi b{display:block}#pi small{color:var(--mut)}
.alt{background:var(--bg);color:var(--fg);border:1px solid var(--grid)}
#msg:empty{display:none}.rw button.t{font-size:13px}
#skp{background:var(--card);border-radius:18px;padding:18px;width:min(260px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 36px rgba(20,20,60,.2)}
#skp h2{margin:0 0 8px;font-size:20px}#skp canvas{width:120px;height:120px;display:block;margin:0 auto 10px}
@media(min-width:700px){#skp{order:-1}}
#rl button,#ol button{white-space:pre-line;line-height:1.35}#ol button{background:var(--bg);color:var(--fg);font-weight:600;text-align:left;font-size:14px;margin:0 0 6px}#pks{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{-webkit-user-select:text;user-select:text}
#ej{position:fixed;right:108px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:60px;height:60px;border-radius:50%;padding:0;font-size:12px;touch-action:none;background:var(--card);color:var(--fg);border:1px solid var(--grid)}

<div id="oT" hidden><label for="tgm">Seekers</label><select id="tgm"><option value="0">Only one</option><option value="1">Percent of players</option></select><div id="tgx" hidden><label for="tgp">Seekers: <span id="tgv">20</span>% of players</label><input id="tgp" type="range" min="5" max="80" value="20"></div></div><label class="ck"><input type="checkbox" id="dg"> Deadly edges and walls</label><label class="ck"><input type="checkbox" id="wr"> Run off the map: wrap around the edges (then only maze walls can be deadly)</label><label for="pm">Player mode</label><select id="pm"><option value="0">Normal blob</option><option value="1">Snake: grow a tail</option><option value="2">Splitter: split into cells</option></select><label class="ck"><input type="checkbox" id="bon" checked> Bots</label><div id="oB"><label for="bct">Number of bots: <span id="bcv">6</span></label><input id="bct" type="range" min="1" max="30" value="6"></div><label for="sz">Map size</label><select id="sz"><option value="0">Small</option><option value="1" selected>Medium</option><option value="2">Big</option><option value="3">Huge</option></select><label for="mt">Map type</label><select id="mt"><option value="0">Open</option><option value="1">Maze</option></select><div id="oS" hidden><label for="sd">Maze seed (empty = random)</label><input id="sd" maxlength="20" autocomplete="off" placeholder="random"></div>
<button id="go">Create room</button><button class="alt back">← Back</button></div>
<div id="vb" hidden><div id="rl"></div><button class="alt back">← Back</button></div>
<div id="vo" hidden><div id="ol"></div><button class="alt back">← Back</button></div>

</div>

<label for="phue">Pattern colour</label><input id="phue" type="range" min="0" max="359"><label for="pvr">Pattern variation</label><input id="pvr" type="range" min="0" max="100">
<details><summary>Emotes (pick a slot, then an emoji)</summary><div class="rw" id="es"></div><div class="rw" id="ep"></div></details></div></div>
<div id="bn" hidden></div>
<div id="goal" hidden><b id="gm"></b><small id="gs"></small></div>

<script>
let W=2200;const VERSION="2.5",$=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),mg=$('mm').getContext('2d');
let dpr=1,vw=0,vh=0;
function rs(){dpr=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr}
addEventListener('resize',rs);rs();
const rnd=(a,b)=>a+Math.random()*(b-a),R=m=>PM()===1?7+1.2*Math.sqrt(m):4*Math.sqrt(m),sp=m=>300*Math.pow(m,-.15),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const col=h=>`hsl(${h} 70% 56%)`;
const SIZES=[{n:'Small',w:1500,p:200},{n:'Medium',w:2200,p:330},{n:'Big',w:3200,p:520},{n:'Huge',w:4800,p:900}];
function genMaze(w,seed){let a=seed>>>0||1;const rn=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const n=Math.max(3,Math.round(w/440)),cs=w/n,vw=[],hw=[],sn=[];for(let i=0;i<n;i++){vw.push(Array(n).fill(1));hw.push(Array(n).fill(1));sn.push(Array(n).fill(0))}
const st=[[0,0]];sn[0][0]=1;
while(st.length){const[i,j]=st[st.length-1],nb=[[i+1,j],[i-1,j],[i,j+1],[i,j-1]].filter(([x,y])=>x>=0&&y>=0&&x<n&&y<n&&!sn[x][y]);if(!nb.length){st.pop();continue}
const[x,y]=nb[rn()*nb.length|0];sn[x][y]=1;if(x>i)vw[i][j]=0;else if(x<i)vw[x][y]=0;else if(y>j)hw[i][j]=0;else hw[x][y]=0;st.push([x,y])}
const o=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(i<n-1&&vw[i][j]&&rn()>.25)o.push([(i+1)*cs-25,j*cs-25,50,cs+50]);if(j<n-1&&hw[i][j]&&rn()>.25)o.push([i*cs-25,(j+1)*cs-25,cs+50,50])}return o}
const mkMap=(sz,ty,sd)=>{sz=cl(sz|0,0,3);const s=SIZES[sz],o={n:s.n+(ty?' maze':''),w:s.w,p:s.p,sz,ty:ty?1:0,seed:ty?sd|0:0};if(sz===0)o.pal={bg:'#0d0b1f',grid:'#1e1a45',wall:'#ff3fa4'};if(ty)o.walls=genMaze(o.w,o.seed);return o};
let CUR=mkMap(1,0,0);
const T={bg:'#eee',grid:'#ddd',wall:'#e5484d'};
function th(){const s=getComputedStyle(document.documentElement);T.bg=s.getPropertyValue('--bg').trim();T.grid=s.getPropertyValue('--grid').trim();T.wall=s.getPropertyValue('--wall').trim();if(CUR.pal)Object.assign(T,CUR.pal)}
th();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',th);
const TS={bg:'#090b18',grid:'#141833',wall:'#ff4d6d'},spr=new Map();let DT=.016;
function sprite(kind,h){h=Math.round(h/6)%60*6;const k=kind+h;let c=spr.get(k);if(c)return c;
  c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),m=64;
  if(kind==='g'){const q=x.createRadialGradient(m,m,10,m,m,64);q.addColorStop(0,`hsla(${h},95%,60%,.6)`);q.addColorStop(.45,`hsla(${h},95%,55%,.2)`);q.addColorStop(1,`hsla(${h},95%,50%,0)`);x.fillStyle=q;x.fillRect(0,0,128,128)}
  else{const q=x.createRadialGradient(m-12,m-14,3,m,m,40);q.addColorStop(0,`hsl(${h},90%,90%)`);q.addColorStop(.35,`hsl(${h},85%,62%)`);q.addColorStop(1,`hsl(${h},80%,38%)`);x.fillStyle=q;x.beginPath();x.arc(m,m,40,0,6.2832);x.fill();x.lineWidth=3;x.strokeStyle=`hsla(${h},90%,80%,.55)`;x.stroke()}
  spr.set(k,c);return c}
const glow=(x,y,r,h,a)=>{const s=r*3.2;g.globalAlpha=a;g.drawImage(sprite('g',h),x-s/2,y-s/2,s,s);g.globalAlpha=1},orbS=(x,y,r,h)=>{const s=r*3.2;g.drawImage(sprite('o',h),x-s/2,y-s/2,s,s)};
function snakeHead(o,r,now,bo){const t=trl.get(o.me?'me':o.key);let a=0;if(t){const p=t.pts,l=p[p.length-1];for(let i=p.length-2;i>=0;i--)if(Math.hypot(l.x-p[i].x,l.y-p[i].y)>r*.5){a=Math.atan2(l.y-p[i].y,l.x-p[i].x);break}}
  g.globalCompositeOperation='lighter';glow(o.x,o.y,r*1.7,o.h,bo?.95:.55);g.globalCompositeOperation='source-over';orbS(o.x,o.y,r*1.04,o.h);
  drawEyes(g,o.x,o.y,r,a,o.ey|0,o.h)}
function drawBody(o,r,x0,y0,x1,y1,z,now,bo){const t=trl.get(o.me?'me':o.key);if(!t)return;const sg=segs(t,r*.8),n=sg.length,hc=k=>(o.pa&&k%4>1)?o.ph:o.h,ok=q=>!(q.x<x0-r*2||q.x>x1+r*2||q.y<y0-r*2||q.y>y1+r*2);
  g.globalCompositeOperation='lighter';for(let k=n-1;k>=0;k-=2){const q=sg[k];if(ok(q))glow(q.x,q.y,r*(1-.4*k/n)*1.5,hc(k),bo?.55:.3)}g.globalCompositeOperation='source-over';
  for(let k=n-1;k>=0;k--){const q=sg[k];if(ok(q))orbS(q.x,q.y,r*(1-.45*k/n),hc(k))}}

// ---- saved settings ----
let sv={};try{sv=JSON.parse(localStorage.getItem('blobz')||'{}')}catch(e){}
let best=+sv.b||0;

const me={x:W/2,y:W/2,m:20,h:Number.isFinite(+sv.h)&&sv.h!==undefined?+sv.h:Math.floor(rnd(0,360)),life:0,pt:0,alive:false,name:'',pa:cl(+sv.pa|0,0,NP),ph:Number.isFinite(+sv.ph)?+sv.ph:200,ang:0,da:0,pv:cl(+sv.pv|0,0,100),ey:cl(+sv.ey|0,0,5),cs:[]};
const save=()=>{try{localStorage.setItem('blobz',JSON.stringify({n:me.name,h:me.h,b:best,em:slots,pa:me.pa,ph:me.ph,pv:me.pv,ey:me.ey}))}catch(e){}};
$('nm').value=sv.n||'';$('hue').value=me.h;$('h1').style.color=col(me.h);
$('hue').oninput=e=>{me.h=+e.target.value;$('h1').style.color=col(me.h)};
const cleanRoom=s=>(s||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,20)||'main';
{const h=location.hash.slice(1);$('rm').value=h?cleanRoom(h):'room'+(1000+(Math.random()*9000|0));$('rj').value=h?cleanRoom(h):''}

// ---- world ----
const pel=[];

  if(pa===1){c.lineWidth=r*.16;c.beginPath();for(let k=-4;k<=4;k++){c.moveTo(x+k*r*.4-r,y-r);c.lineTo(x+k*r*.4+r,y+r)}c.stroke()}
  else if(pa===2){for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){c.beginPath();c.arc(x+i*r*.4,y+j*r*.4,r*.09,0,6.2832);c.fill()}}
  else if(pa===3){c.lineWidth=r*.1;for(const f of[.3,.62,.94]){c.beginPath();c.arc(x,y,r*f,0,6.2832);c.stroke()}}
  else if(pa===4){const q=r*.4;for(let i=-3;i<=2;i++)for(let j=-3;j<=2;j++)if((i+j)&1)c.fillRect(x+i*q,y+j*q,q,q)}
  else if(pa===5)for(let k=0;k<8;k+=2){c.beginPath();c.moveTo(x,y);c.arc(x,y,r*1.1,k*Math.PI/4,(k+1)*Math.PI/4);c.closePath();c.fill()}
  else if(pa===6){c.lineWidth=r*.12;for(let k=-3;k<=3;k++){c.beginPath();for(let i=-5;i<=5;i++)c.lineTo(x+i*r*.22,y+k*r*.4+(i&1?r*.12:-r*.12));c.stroke()}}
  else if(pa===7){c.font=r*.38+'px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)c.fillText('★',x+i*r*.5+(j&1?r*.25:0),y+j*r*.45)}
  else if(pa===8){c.lineWidth=r*.1;c.beginPath();for(let a=0;a<18;a+=.15){const q=a/18*r*1.1;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.stroke()}
  else if(pa===9){c.lineWidth=r*.1;for(let k=-3;k<=3;k++){c.beginPath();for(let i=-10;i<=10;i++)c.lineTo(x+i*r*.11,y+k*r*.35+Math.sin(i*.7)*r*.1);c.stroke()}}
  else if(pa===10)c.fillRect(x-r,y,r*2,r)
  else if(pa===11){const q=r*.2;for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++)if(!((i+j)&1)){const u=x+i*r*.4,v=y+j*r*.4;c.beginPath();c.moveTo(u,v-q);c.lineTo(u+q,v);c.lineTo(u,v+q);c.lineTo(u-q,v);c.fill()}}
  else if(pa===12){c.lineWidth=r*.07;c.beginPath();for(let k=-3;k<=3;k++){c.moveTo(x+k*r*.4,y-r);c.lineTo(x+k*r*.4,y+r);c.moveTo(x-r,y+k*r*.4);c.lineTo(x+r,y+k*r*.4)}c.stroke()}
  else if(pa===13){const q=r*.16,t=r*.05;for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){const u=x+i*r*.5,v=y+j*r*.5;c.fillRect(u-q,v-t,q*2,t*2);c.fillRect(u-t,v-q,t*2,q*2)}}
  else for(let i=0;i<9;i++){const a=i*2.4+pv*.37,d=r*.7*(((i+(pv|0))%3)/3+.2);c.beginPath();c.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,r*(.18+((i*(1+pv%2))%3)*.05),0,6.2832);c.fill()}
  c.restore();
}
const skc=$('sk').getContext('2d');
function skin(){skc.clearRect(0,0,120,120);skc.fillStyle=col(me.h);skc.beginPath();skc.arc(60,60,50,0,6.2832);skc.fill();drawPat(skc,60,60,50,me.pa,me.ph,me.pv);skc.lineWidth=5;skc.strokeStyle='#fff';skc.beginPath();skc.arc(60,60,50,0,6.2832);skc.stroke();drawEyes(skc,60,60,50,0,me.ey,me.h)}
function buildPat(){$('pat').textContent='';PATS.forEach((n,i)=>mk(n,()=>{me.pa=i;buildPat();skin()},$('pat'),i===me.pa?'on t':'t'))}
$('hue').oninput=e=>{me.h=+e.target.value;$('h1').style.color=col(me.h);skin()};

buildPat();buildEye();skin();

function evDef(){$('ev').value=$('end').value==='1'?3:(+$('mo').value===3?100:60)}
$('mo').onchange=$('end').onchange=()=>{evDef();modeUi()};evDef();modeUi();
buildEm();
const seedOf=t=>{t=t.trim();if(!t)return 1+(Math.random()*999999999|0);if(/^\d{1,9}$/.test(t))return+t||1;let h=7;for(const ch of t)h=Math.imul(h,31)+ch.charCodeAt(0)|0;return h||1};
for(const k of PK){const l=document.createElement('label'),i=document.createElement('input');l.className='ck';i.type='checkbox';i.id='pk_'+k;i.checked=true;l.append(i,PI[k]+' '+PN[k][0]);$('pks').appendChild(l)}
function hostUi(){modeUi();$('oP').hidden=!$('pw').checked;$('oB').hidden=!$('bon').checked;$('oS').hidden=$('mt').value!=='1';$('bcv').textContent=$('bct').value;$('pfv').textContent=$('pfq').value}
for(const id of['pw','bon','mt','bct','pfq','tgm','tgp'])$(id).addEventListener('input',hostUi);
const PRE={normal:{pm:0,mo:0,sz:1,mt:0,bon:1,bct:6,pw:0,pf:5,pks:PK},snake:{dg:1,pm:1,mo:0,sz:3,mt:0,bon:1,bct:25,pw:1,pf:3,pks:['bolt','magnet','feast','grow','nitro']},splitter:{pm:2,mo:0,sz:2,mt:0,bon:1,bct:15,pw:0,pf:5,pks:PK},maze:{pm:0,mo:1,sz:1,mt:1,bon:1,bct:8,pw:1,pf:6,pks:PK}};
$('ps').onchange=e=>{const v=e.target.value;let p=PRE[v];if(v==='rnd'){const r=Math.random;p={wr:r()<.15?1:0,dg:r()<.2?1:0,pm:r()*3|0,mo:r()*4|0,sz:r()*4|0,mt:r()<.4?1:0,bon:r()<.8?1:0,bct:1+(r()*30|0),pw:r()<.6?1:0,pf:1+(r()*10|0),pks:PK.filter(()=>r()<.6)};if(!p.pks.length)p.pks=[pk(PK)]}
  if(p){$('pm').value=p.pm;$('dg').checked=!!p.dg;$('wr').checked=!!p.wr;$('mo').value=p.mo;$('sz').value=p.sz;$('mt').value=p.mt;$('sd').value='';$('bon').checked=!!p.bon;$('bct').value=p.bct;$('pw').checked=!!p.pw;$('pfq').value=p.pf;for(const k of PK)$('pk_'+k).checked=p.pks.includes(k);evDef();hostUi()}e.target.value=''};
hostUi();
$('ver').textContent='v'+VERSION;
requestAnimationFrame(tick);
