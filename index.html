<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blobz.io</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%236b4cf0'/%3E%3C/svg%3E">
<style>
:root{--bg:#eef0f7;--grid:#dde1ee;--fg:#1b1d2e;--card:#fff;--mut:#666b85;--acc:#6b4cf0;--wall:#e5484d;--gold:#c98500;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141f;--grid:#1d2132;--fg:#e9ebf6;--card:#1b1f31;--mut:#9aa0bd;--acc:#8f7bff;--gold:#ffc83d}}
:root[data-theme="dark"]{--bg:#12141f;--grid:#1d2132;--fg:#e9ebf6;--card:#1b1f31;--mut:#9aa0bd;--acc:#8f7bff;--gold:#ffc83d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;font-size:13px}
#hud>div,#mm{background:color-mix(in srgb,var(--card) 85%,transparent);border-radius:10px}
#hud>div{padding:6px 10px;white-space:pre}
#st{pointer-events:auto}
#em{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column-reverse;align-items:center;gap:6px}
#em button{width:44px;height:44px;padding:0;margin:0;border-radius:50%;font-size:22px;background:var(--card);box-shadow:0 2px 10px rgba(20,20,60,.2)}
#emr{display:flex;gap:6px;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--card) 90%,transparent)}
#emr[hidden]{display:none}
#bn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;pointer-events:none;text-align:center}
.rw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
.rw button{width:auto;margin:0;padding:5px 8px;font-size:20px;background:var(--bg);color:var(--fg);border:2px solid transparent}
.rw button.on{border-color:var(--acc)}
#rl button{background:var(--bg);color:var(--fg);font-weight:600;text-align:left;font-size:14px;margin:0 0 6px}
details{text-align:left;margin-bottom:10px;color:var(--mut)}
summary{cursor:pointer;margin-bottom:8px}
label.ck{display:flex;align-items:center;font-size:14px;color:var(--fg);margin:4px 0 8px}
input[type=checkbox]{width:auto;margin:0 8px 0 0;padding:0}
#ver{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);font-size:11px;color:var(--mut);opacity:.8;pointer-events:none}
#mm{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:96px;height:96px;pointer-events:none}
#bst{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:76px;height:76px;border-radius:50%;padding:0;font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none}
#ov{position:fixed;inset:0;display:flex;flex-wrap:wrap;gap:12px;overflow:auto;align-items:flex-start;align-content:safe center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 70%,transparent)}
#card{background:var(--card);border-radius:18px;padding:22px;width:min(340px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 36px rgba(20,20,60,.2)}
h1{margin:0 0 6px;font-size:30px;letter-spacing:-.02em}
p{color:var(--mut);margin:0 0 14px}
input,button,select{font:inherit;font-size:16px;width:100%;box-sizing:border-box;border-radius:10px;padding:12px;border:1px solid var(--grid);background:var(--bg);color:var(--fg);margin-bottom:8px}
input[type=range]{padding:0;border:0;background:transparent;height:28px}
button{background:var(--acc);border:0;color:#fff;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{display:block;text-align:left;font-size:12px;color:var(--mut);margin:2px 2px 4px}
#lb .k1{color:var(--gold);font-weight:800}
#mnb{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 86px);width:auto;margin:0;padding:7px 12px;font-size:13px;background:color-mix(in srgb,var(--card) 88%,transparent);color:var(--fg);border:1px solid var(--grid)}
#cf,#dc{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,10,30,.5)}
#cf[hidden],#dc[hidden]{display:none}
#cf>div,#dc>div{background:var(--card);border-radius:18px;padding:22px;width:min(320px,100%);text-align:center;box-shadow:0 10px 36px rgba(20,20,60,.3)}
#cf h2,#dc h2{margin:0 0 6px;font-size:22px}
#cfy{background:var(--wall)}
#goal{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;padding:8px 20px;border-radius:16px;background:color-mix(in srgb,var(--card) 88%,transparent);box-shadow:0 4px 16px rgba(20,20,60,.15);white-space:nowrap}
#goal[hidden]{display:none}#goal b{display:block;font-size:30px;line-height:1.1}#goal small{display:block;font-size:12px;color:var(--mut)}
#pi{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);padding:8px 14px;border-radius:12px;background:color-mix(in srgb,var(--card) 94%,transparent);box-shadow:0 4px 16px rgba(20,20,60,.2);text-align:center;pointer-events:none;max-width:min(300px,90vw)}
#pi[hidden]{display:none}#pi b{display:block}#pi small{color:var(--mut)}
.alt{background:var(--bg);color:var(--fg);border:1px solid var(--grid)}
#msg:empty{display:none}.rw button.t{font-size:13px}
#skp{background:var(--card);border-radius:18px;padding:18px;width:min(260px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 36px rgba(20,20,60,.2)}
#skp h2{margin:0 0 8px;font-size:20px}#skp canvas{width:120px;height:120px;display:block;margin:0 auto 10px}
@media(min-width:700px){#skp{order:-1}}
#rl button{white-space:pre-line;line-height:1.35}#pks{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="mm" width="96" height="96"></canvas>
<button id="bst">Boost</button>
<div id="em"><button id="emt" aria-label="Emotes">😀</button><div id="emr" hidden></div></div>
<div id="hud"><div id="st"></div><div id="lb"></div></div>
<div id="ov"><div id="card">
<h1 id="h1">Blobz.io</h1>
<p id="msg"></p>
<input id="nm" maxlength="14" placeholder="Nickname" autocomplete="off" enterkeyhint="go" aria-label="Nickname">
<div id="v0"><button id="bh">Host room</button><button id="br" class="alt">Browse rooms</button><button id="brn" class="alt">Join random</button><button id="bj" class="alt">Join by name</button></div>
<div id="vh" hidden><label for="ps">Preset</label><select id="ps"><option value="">Pick a preset to fill the settings…</option><option value="normal">Normal</option><option value="slither">Slither-like (huge map, many bots)</option><option value="agar">Agar.io-like (big map, bots, no powerups)</option><option value="maze">Maze rush</option><option value="rnd">🎲 Random everything</option></select>
<label for="rm">Room name</label><input id="rm" maxlength="20" autocomplete="off" aria-label="Room name">
<label class="ck"><input type="checkbox" id="pub" checked> Public (listed in Browse; off = private, join by name or link only)</label>
<label class="ck"><input type="checkbox" id="pw"> Powerups (off by default)</label><div id="oP" hidden><label for="pfq">Powerup frequency: <span id="pfv">5</span>/10</label><input id="pfq" type="range" min="1" max="10" value="5"><label>Enabled powerups</label><div id="pks"></div></div>
<label for="mo">Game mode</label><select id="mo"><option value="0">Classic / Endless</option><option value="1">Rush: timed rounds</option><option value="2">Hill: hold the zone</option><option value="3">Tag: runners score, more near the seeker</option></select>
<div id="oR" hidden><label for="rlen">Round length (minutes)</label><input id="rlen" type="number" inputmode="decimal" min="0" step="any" value="3"></div>
<div id="oE" hidden><label for="end">Play until</label><select id="end"><option value="0">Goal (first to reach it)</option><option value="1">Time (most points when it ends)</option></select><label for="ev" id="evl">Goal (points)</label><input id="ev" type="number" inputmode="decimal" min="0" step="any"></div>
<label class="ck"><input type="checkbox" id="bon" checked> Bots</label><div id="oB"><label for="bct">Number of bots: <span id="bcv">6</span></label><input id="bct" type="range" min="1" max="30" value="6"></div><label for="sz">Map size</label><select id="sz"><option value="0">Small</option><option value="1" selected>Medium</option><option value="2">Big</option><option value="3">Huge</option></select><label for="mt">Map type</label><select id="mt"><option value="0">Open</option><option value="1">Maze</option></select><div id="oS" hidden><label for="sd">Maze seed (empty = random)</label><input id="sd" maxlength="20" autocomplete="off" placeholder="random"></div>
<button id="go">Create room</button><button class="alt back">← Back</button></div>
<div id="vb" hidden><div id="rl"></div><button class="alt back">← Back</button></div>
<div id="vj" hidden><label for="rj">Room name</label><input id="rj" maxlength="20" autocomplete="off" aria-label="Room name to join"><button id="gj">Join</button><button class="alt back">← Back</button></div>
<p id="net" style="margin:8px 0 0;font-size:13px">Connecting…</p>
</div>
<div id="skp"><h2>Your blob</h2><canvas id="sk" width="120" height="120"></canvas>
<label for="hue">Body colour</label><input id="hue" type="range" min="0" max="359">
<label>Pattern</label><div class="rw" id="pat"></div>
<label for="phue">Pattern colour</label><input id="phue" type="range" min="0" max="359">
<details><summary>Emotes (pick a slot, then an emoji)</summary><div class="rw" id="es"></div><div class="rw" id="ep"></div></details></div></div>
<div id="bn" hidden></div>
<div id="goal" hidden><b id="gm"></b><small id="gs"></small></div>
<div id="pi" hidden></div>
<div id="dc" hidden role="dialog" aria-modal="true"><div><h2>You were swallowed</h2><p id="dm"></p><button id="dr">Respawn</button><button id="db" style="background:var(--bg);color:var(--fg);border:1px solid var(--grid)">Back to menu</button></div></div>
<button id="mnb" hidden title="Back to menu (Esc)">☰ Menu</button>
<div id="cf" hidden role="dialog" aria-modal="true" aria-labelledby="cft"><div><h2 id="cft">Back to menu?</h2><p id="cfp"></p><button id="cfn">Keep playing</button><button id="cfy">Leave and lose progress</button></div></div>
<div id="ver"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let W=2200;const VERSION="2.0",$=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),mg=$('mm').getContext('2d');
let dpr=1,vw=0,vh=0;
function rs(){dpr=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr}
addEventListener('resize',rs);rs();
const rnd=(a,b)=>a+Math.random()*(b-a),R=m=>4*Math.sqrt(m),sp=m=>300*Math.pow(m,-.15),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const col=h=>`hsl(${h} 70% 56%)`;
const SIZES=[{n:'Small',w:1500,p:200},{n:'Medium',w:2200,p:330},{n:'Big',w:3200,p:520},{n:'Huge',w:4800,p:900}];
function genMaze(w,seed){let a=seed>>>0||1;const rn=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const n=Math.max(3,Math.round(w/440)),cs=w/n,vw=[],hw=[],sn=[];for(let i=0;i<n;i++){vw.push(Array(n).fill(1));hw.push(Array(n).fill(1));sn.push(Array(n).fill(0))}
const st=[[0,0]];sn[0][0]=1;
while(st.length){const[i,j]=st[st.length-1],nb=[[i+1,j],[i-1,j],[i,j+1],[i,j-1]].filter(([x,y])=>x>=0&&y>=0&&x<n&&y<n&&!sn[x][y]);if(!nb.length){st.pop();continue}
const[x,y]=nb[rn()*nb.length|0];sn[x][y]=1;if(x>i)vw[i][j]=0;else if(x<i)vw[x][y]=0;else if(y>j)hw[i][j]=0;else hw[x][y]=0;st.push([x,y])}
const o=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(i<n-1&&vw[i][j]&&rn()>.25)o.push([(i+1)*cs-25,j*cs-25,50,cs+50]);if(j<n-1&&hw[i][j]&&rn()>.25)o.push([i*cs-25,(j+1)*cs-25,cs+50,50])}return o}
const mkMap=(sz,ty,sd)=>{sz=cl(sz|0,0,3);const s=SIZES[sz],o={n:s.n+(ty?' maze':''),w:s.w,p:s.p,sz,ty:ty?1:0,seed:ty?sd|0:0};if(sz===0)o.pal={bg:'#0d0b1f',grid:'#1e1a45',wall:'#ff3fa4'};if(ty)o.walls=genMaze(o.w,o.seed);return o};
let CUR=mkMap(1,0,0);
const T={bg:'#eee',grid:'#ddd',wall:'#e5484d'};
function th(){const s=getComputedStyle(document.documentElement);T.bg=s.getPropertyValue('--bg').trim();T.grid=s.getPropertyValue('--grid').trim();T.wall=s.getPropertyValue('--wall').trim();if(CUR.pal)Object.assign(T,CUR.pal)}
th();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',th);

// ---- saved settings ----
let sv={};try{sv=JSON.parse(localStorage.getItem('blobz')||'{}')}catch(e){}
let best=+sv.b||0;
const PATS=['None','Stripes','Dots','Rings','Checks','Rays','Zigzag','Stars','Spiral','Waves','Split','Diamonds','Grid','Crosses','Camo'],NP=PATS.length-1;
const me={x:W/2,y:W/2,m:20,h:Number.isFinite(+sv.h)&&sv.h!==undefined?+sv.h:Math.floor(rnd(0,360)),life:0,pt:0,alive:false,name:'',pa:cl(+sv.pa|0,0,NP),ph:Number.isFinite(+sv.ph)?+sv.ph:200};
const save=()=>{try{localStorage.setItem('blobz',JSON.stringify({n:me.name,h:me.h,b:best,em:slots,pa:me.pa,ph:me.ph}))}catch(e){}};
$('nm').value=sv.n||'';$('hue').value=me.h;$('h1').style.color=col(me.h);
$('hue').oninput=e=>{me.h=+e.target.value;$('h1').style.color=col(me.h)};
const cleanRoom=s=>(s||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,20)||'main';
{const h=location.hash.slice(1);$('rm').value=h?cleanRoom(h):'room'+(1000+(Math.random()*9000|0));$('rj').value=h?cleanRoom(h):''}

// ---- world ----
const pel=[];
function setMap(sz,ty,sd){CUR=mkMap(sz,ty,sd);W=CUR.w;th();pel.length=0;H.pups.length=0;net.pups=[];for(let k=0;k<CUR.p;k++){const q={x:0,y:0,h:rnd(0,360)};rp(q);pel.push(q)}for(const b of H.bots){const p=spot(R(b.m));b.x=p[0];b.y=p[1]}if(me.alive){const p=spot(R(me.m));me.x=p[0];me.y=p[1]}else{me.x=W/2;me.y=W/2}}
const POOL=['👋','😂','😠','😮','💜','👍','👎','😭','😎','🤔','🎉','🔥','💀','🙏','😴','🤝','👀','😈','🥳','😱','❤️','💩','🤡','✌️','😅','🤣','😍','😘','🥺','😤','🤯','🤪','😇','🙃','😬','🤫','🤭','🥶','🥵','🤢','🤑','🤖','👻','👽','💪','👏','🙌','🤞','💔','💯','💥','🌈','⭐','🍀','🍕','🎮','🏆','🚀','🧠','😳','😏','🤷','🙈','🐢','🍉','🎯','💎'],MODES=['Classic/Endless','Rush','Hill','Tag'];
const PK=['bolt','shield','mass','magnet','feast','scope','nitro','burst','radar','grow'],PI={bolt:'⚡',shield:'🛡',mass:'✚',magnet:'🧲',feast:'🍎',scope:'🔭',nitro:'🚀',burst:'💥',radar:'📡',grow:'🌱'},PC={bolt:'#f5a623',shield:'#3aa8ff',mass:'#35c76f',magnet:'#e0457b',feast:'#e8542a',scope:'#9b6bff',nitro:'#17c3b2',burst:'#ff3b30',radar:'#7a8599',grow:'#b8d62a'},PD={bolt:8,shield:8,magnet:8,feast:10,scope:12,nitro:8,radar:14,grow:8};
const BN='Pip Moss Zed Orb Juno Kit Nova Bix Taco Wisp Rex Lumi Fizz Gus Mochi Pixel Echo Blip Sunny Cosmo Dot Rune Yuki Otto Pepper Zig Mango Flux Nimbus Tofu Jinx Ember Luna Milo Ziggy Hugo Ivy Koa Mira Nico Odin Pia Quinn Rosa Sora Tilly Uma Vex Wren Yara Zola Abe Bo Cleo Dax Elf Finn Gigi Hana Ines Jax Kai Lola Maya Ned Opal Pru Rio Sage Tess Ugo Vera Wes Xena Yago Zane Boba Churro Dumpling Egg Fudge Gizmo Hobbit Iggy Jelly Koala Lemon Nacho Olive Pickle Quokka Ramen Sushi Waffle'.split(' '),
BA='Sneaky Fuzzy Salty Sleepy Spicy Cosmic Wobbly Tiny Mighty Lazy Jolly Grumpy Silent Crispy Dizzy Cranky Bouncy Frosty Quirky Rusty Turbo Hungry Wild Zesty Dusty Mellow Rapid Shady Peppy Misty Giddy Plucky Fluffy Chilly Moody Nifty Lucky'.split(' '),
BO='Waffle Pickle Muffin Walrus Badger Toast Noodle Goblin Comet Pebble Biscuit Falcon Otter Cactus Turnip Gecko Yeti Llama Panda Mango Radish Kiwi Bagel Raven Squid Taco Wombat Dragon Pretzel Robot Sprout Cobra Dingo Moose Lemur Puffin Ninja Pirate Wizard Cookie'.split(' '),
BP='Lil Big Sir Dr Capt Mr Ms Uncle Aunt Chef Coach Baron'.split(' '),
BF=['feed me','just vibing','pls dont eat','hi mom','snack time','nom nom nom','not a bot','send help','big mood','cant catch me','ur lunch','zoomies','one more try','oh no oh no','sry in advance'];
const pk=a=>a[Math.random()*a.length|0],lt=t=>t.replace(/[aeio]/g,c=>({a:'4',e:'3',i:'1',o:'0'})[c]);
function bname1(){const b=pk(BN),r=Math.random();
  return r<.12?b:r<.22?b+(Math.random()<.5?(10+Math.random()*90|0):'0'+(1+Math.random()*9|0)):r<.3?pk(BP)+' '+b:r<.4?b.toLowerCase()+'_'+(1+Math.random()*99|0):r<.46?b.toUpperCase():r<.64?pk(BA)+pk(BO):r<.7?pk(BA).toLowerCase()+' '+pk(BO).toLowerCase():r<.76?'xX'+b+'Xx':r<.82?lt(b.toLowerCase()):r<.88?b+pk(['_gg','_tv','_xd','.exe','_jr','_irl']):pk(BF)}
const bname=()=>{const used=new Set(H.bots.map(b=>b.n));let n;for(let i=0;i<10;i++){n=bname1();if(n.length<=14&&!used.has(n))return n}return n.slice(0,14)};
const inWall=(x,y,r)=>{const w=CUR.walls;if(!w)return false;for(const[a,b,c,d]of w)if(x>a-r&&x<a+c+r&&y>b-r&&y<b+d+r)return true;return false};
function rp(q){let n=0;do{q.x=rnd(0,W);q.y=rnd(0,W)}while(inWall(q.x,q.y,8)&&++n<30)}
function spot(r){const os=[...net.peers,...(isHost?H.bots:net.bots)];if(me.alive)os.push(me);let x,y;for(let i=0;i<60;i++){x=rnd(150,W-150);y=rnd(150,W-150);if(inWall(x,y,r+30))continue;if(os.every(o=>Math.hypot(o.x-x,o.y-y)>R(o.m)+r+150))break}return[x,y]}
function wallPush(o,r){const w=CUR.walls;if(!w)return;for(const[a,b,c,d]of w){const qx=cl(o.x,a,a+c),qy=cl(o.y,b,b+d),dx=o.x-qx,dy=o.y-qy,dd=Math.hypot(dx,dy);if(dd<r){if(dd<.001){const l=o.x-a,rr=a+c-o.x,t=o.y-b,bt=b+d-o.y,m=Math.min(l,rr,t,bt);if(m===l)o.x=a-r;else if(m===rr)o.x=a+c+r;else if(m===t)o.y=b-r;else o.y=b+d+r}else{o.x=qx+dx/dd*r;o.y=qy+dy/dd*r}}}o.x=cl(o.x,0,W);o.y=cl(o.y,0,W)}

  else if(pa===7){c.font=r*.38+'px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)c.fillText('★',x+i*r*.5+(j&1?r*.25:0),y+j*r*.45)}
  else if(pa===8){c.lineWidth=r*.1;c.beginPath();for(let a=0;a<18;a+=.15){const q=a/18*r*1.1;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.stroke()}
  else if(pa===9){c.lineWidth=r*.1;for(let k=-3;k<=3;k++){c.beginPath();for(let i=-10;i<=10;i++)c.lineTo(x+i*r*.11,y+k*r*.35+Math.sin(i*.7)*r*.1);c.stroke()}}
  else if(pa===10)c.fillRect(x-r,y,r*2,r)
  else if(pa===11){const q=r*.2;for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++)if(!((i+j)&1)){const u=x+i*r*.4,v=y+j*r*.4;c.beginPath();c.moveTo(u,v-q);c.lineTo(u+q,v);c.lineTo(u,v+q);c.lineTo(u-q,v);c.fill()}}
  else if(pa===12){c.lineWidth=r*.07;c.beginPath();for(let k=-3;k<=3;k++){c.moveTo(x+k*r*.4,y-r);c.lineTo(x+k*r*.4,y+r);c.moveTo(x-r,y+k*r*.4);c.lineTo(x+r,y+k*r*.4)}c.stroke()}
  else if(pa===13){const q=r*.16,t=r*.05;for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){const u=x+i*r*.5,v=y+j*r*.5;c.fillRect(u-q,v-t,q*2,t*2);c.fillRect(u-t,v-q,t*2,q*2)}}
  else for(let i=0;i<9;i++){const a=i*2.4,d=r*.7*((i%3)/3+.2);c.beginPath();c.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,r*(.18+(i%3)*.05),0,6.2832);c.fill()}
  c.restore();
}
